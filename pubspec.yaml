name: bumpjourney
description: "孕育时光 · BumpJourney — 孕期周期全流程管理 App"
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3        # 桌面端(Windows/macOS/Linux)运行支持
  path: ^1.9.0
  path_provider: ^2.1.3
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4                    # 本地通知定时调度(随 flutter_local_notifications)
  shared_preferences: ^2.2.3
  http: ^1.2.1                       # 预留:云端 LLM 结构化提取

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
